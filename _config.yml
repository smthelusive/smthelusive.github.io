title: Nataliia Dziubenko
description: Blog
blog_description:
  Curiosity brings us to a beautiful journey. Let's share this journey together.
header_tagline: poking my nose into how things work under the hood
baseurl: "" # the subpath of your site, e.g. /blog
url: https://nataliiadziubenko.com # the base hostname & protocol for your site, e.g. http://example.com
paginate: 12
include:
  - .well-known
  - ads.txt
# Build settings
theme: minima
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

# Cozy corner: posts for puzzle players and cozy gamers. Own look and URLs, not listed on the blog page or in the feed.
collections:
  cozy_corner:
    output: true
    permalink: /cozy-corner/:name/
defaults:
  - scope:
      path: ""
      type: cozy_corner
    values:
      layout: cozy-post
