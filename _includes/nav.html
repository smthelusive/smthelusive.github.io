<script>
    function toggleTheme() {
        var root = document.documentElement;
        var osTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var current = root.getAttribute('data-theme') || osTheme;
        var next = current === 'dark' ? 'light' : 'dark';
        // Only remember a choice that overrides the OS setting.
        if (next === osTheme) {
            root.removeAttribute('data-theme');
            try { localStorage.removeItem('theme'); } catch (e) {}
        } else {
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
        }
    }

    function countVisit(event) {
        if (event.pointerType == "mouse" || event.pointerType == "touch") {
            new Image().src = 'https://hits.sh/nataliiadziubenko.com/bmc-hits.svg';
        }
    }
</script>
