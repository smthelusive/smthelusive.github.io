<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
{% include head.html %}
</head>
<body class="no-bars">
<header class="site-header slim-header">
    {% include nav.html %}
</header>
{{ content }}
<button type="button" class="hand-button back-to-top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" aria-label="Back to top">↑ top</button>
<script>
    // Show the back-to-top button once the reader is past the first panel or so.
    (function () {
        var button = document.querySelector('.back-to-top');
        function update() {
            button.classList.toggle('visible', window.scrollY > window.innerHeight);
        }
        window.addEventListener('scroll', update, { passive: true });
        update();
    })();
</script>
<div class="footer-wrap">
{% include footer.html %}
</div>
</body>
</html>
