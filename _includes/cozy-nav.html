<script>
    function toggleTheme() {
        var root = document.documentElement;
        var osTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var current = root.getAttribute('data-theme') || osTheme;
        var next = current === 'dark' ? 'light' : 'dark';
        // Only remember a choice that overrides the OS setting.
        if (next === osTheme) {
            root.removeAttribute('data-theme');
            try { localStorage.removeItem('theme'); } catch (e) {}
        } else {
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
        }
    }
</script>
<a id="skip-to-content" href="#content">Skip to the content.</a>
<nav class="site-nav" aria-label="Main">
    <a href="/cozy-corner/" class="nav-button{% if page.url == '/cozy-corner/' %} active{% endif %}">all posts</a>
